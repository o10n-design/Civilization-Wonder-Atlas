<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Vatican Renaissance Dome & Papal Keys -->
    <!-- Crossed Keys of Heaven -->
    <line x1="28" y1="28" x2="72" y2="72" stroke="#ffe89e" stroke-width="2.5"/>
    <line x1="72" y1="28" x2="28" y2="72" stroke="#ffe89e" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="4" fill="none" stroke="#f5be2c" stroke-width="2"/>
    <circle cx="72" cy="28" r="4" fill="none" stroke="#f5be2c" stroke-width="2"/>
    <!-- Palace Cupola Dome -->
    <path d="M34 52 C34 32 66 32 66 52 Z" fill="#e2e8f0" stroke="#f5be2c" stroke-width="2.5"/>
    <line x1="50" y1="24" x2="50" y2="34" stroke="#ffe89e" stroke-width="2"/>
    <!-- Facade with Renaissance Arches -->
    <rect x="24" y="52" width="52" height="30" fill="#94a3b8" stroke="#f5be2c" stroke-width="2"/>
    <path d="M32 82 C32 68 44 68 44 82 Z" fill="#0f172a" stroke="#ffe89e" stroke-width="1.5"/>
    <path d="M56 82 C56 68 68 68 68 82 Z" fill="#0f172a" stroke="#ffe89e" stroke-width="1.5"/>
  
  </g>
</svg>