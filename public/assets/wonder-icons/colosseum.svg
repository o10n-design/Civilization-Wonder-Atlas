<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Flavian Amphitheatre (Colosseum of Rome) -->
    <ellipse cx="50" cy="62" rx="36" ry="16" fill="#334155" stroke="#f5be2c" stroke-width="2"/>
    <!-- Broken Outer Ring -->
    <path d="M16 62 C16 42 36 28 62 28 C74 28 82 34 84 46 L84 62" fill="none" stroke="#f5be2c" stroke-width="3"/>
    <!-- Travertine Arches -->
    <path d="M22 58 C22 46 36 46 36 58 M38 56 C38 44 50 44 50 56 M52 54 C52 42 64 42 64 54 M66 54 C66 42 78 42 78 54" fill="none" stroke="#ffe89e" stroke-width="2"/>
    <!-- Arena Floor -->
    <ellipse cx="50" cy="64" rx="22" ry="8" fill="#d97706" opacity="0.6"/>
  
  </g>
</svg>