<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Pharos of Alexandria Tower & Blazing Beacon Fire -->
    <polygon points="46,14 54,14 52,22 48,22" fill="#ffe89e"/>
    <circle cx="50" cy="24" r="5" fill="#f5be2c"/>
    <path d="M26 24 L45 24 M55 24 L74 24" stroke="#ffe89e" stroke-width="2" stroke-linecap="round"/>
    <!-- Octagonal Middle Stage -->
    <polygon points="44,30 56,30 58,48 42,48" fill="#94a3b8" stroke="#f5be2c" stroke-width="2"/>
    <!-- Massive Tapering Base Stage -->
    <polygon points="38,48 62,48 68,82 32,82" fill="#475569" stroke="#f5be2c" stroke-width="2"/>
    <!-- Entrance Portal -->
    <rect x="46" y="68" width="8" height="14" fill="#0f172a" stroke="#ffe89e" stroke-width="1.5"/>
    <!-- Ocean Waves at Base -->
    <path d="M18 82 Q34 78 50 82 Q66 86 82 82" fill="none" stroke="#46d2bc" stroke-width="2.5"/>
  
  </g>
</svg>