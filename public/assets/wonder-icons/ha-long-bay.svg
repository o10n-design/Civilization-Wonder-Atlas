<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#46d2bc" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#46d2bc" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Limestone Karst Islets & Traditional Junk Boat -->
    <!-- Karst Mountain Towers -->
    <polygon points="20,74 32,32 44,74" fill="#047857" stroke="#f5be2c" stroke-width="2"/>
    <polygon points="40,74 54,24 66,74" fill="#065f46" stroke="#f5be2c" stroke-width="2"/>
    <polygon points="62,74 74,40 84,74" fill="#047857" stroke="#f5be2c" stroke-width="2"/>
    <!-- Emerald Water -->
    <path d="M12 76 C24 74 36 78 48 75 C60 72 72 77 88 74" fill="none" stroke="#46d2bc" stroke-width="3"/>
    <!-- Junk Boat with Ribbed Sail -->
    <polygon points="26,76 42,76 40,70 28,70" fill="#78350f"/>
    <polygon points="34,56 42,68 34,68" fill="#dc2626"/>
  
  </g>
</svg>