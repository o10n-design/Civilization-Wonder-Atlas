<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Classical Doric Temple on Acropolis -->
    <!-- Triangular Pediment -->
    <polygon points="16,36 50,18 84,36" fill="#e2e8f0" stroke="#f5be2c" stroke-width="2"/>
    <!-- Frieze & Architrave -->
    <rect x="20" y="36" width="60" height="6" fill="#cbd5e1" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Doric Columns -->
    <line x1="24" y1="42" x2="24" y2="74" stroke="#f8fafc" stroke-width="3"/>
    <line x1="34" y1="42" x2="34" y2="74" stroke="#f8fafc" stroke-width="3"/>
    <line x1="44" y1="42" x2="44" y2="74" stroke="#f8fafc" stroke-width="3"/>
    <line x1="56" y1="42" x2="56" y2="74" stroke="#f8fafc" stroke-width="3"/>
    <line x1="66" y1="42" x2="66" y2="74" stroke="#f8fafc" stroke-width="3"/>
    <line x1="76" y1="42" x2="76" y2="74" stroke="#f8fafc" stroke-width="3"/>
    <!-- Crepidoma (Stepped Marble Base) -->
    <rect x="18" y="74" width="64" height="4" fill="#94a3b8" stroke="#f5be2c" stroke-width="1"/>
    <rect x="14" y="78" width="72" height="4" fill="#64748b" stroke="#f5be2c" stroke-width="1"/>
  
  </g>
</svg>