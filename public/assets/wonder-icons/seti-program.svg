<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#46d2bc" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#46d2bc" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Giant Radio Telescope Dish scanning the Cosmos -->
    <!-- Stars -->
    <circle cx="20" cy="20" r="1.5" fill="#ffe89e"/>
    <circle cx="78" cy="18" r="1.5" fill="#ffe89e"/>
    <circle cx="85" cy="35" r="1.2" fill="#ffe89e"/>
    <circle cx="16" cy="45" r="1.2" fill="#ffe89e"/>
    <!-- Radio Waves -->
    <path d="M62 20 A30 30 0 0 1 88 46" fill="none" stroke="#46d2bc" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,3"/>
    <path d="M68 14 A40 40 0 0 1 96 42" fill="none" stroke="#46d2bc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Dish Structure -->
    <ellipse cx="44" cy="52" rx="34" ry="22" transform="rotate(-30 44 52)" fill="#1c242c" stroke="#f5be2c" stroke-width="3"/>
    <line x1="44" y1="52" x2="68" y2="30" stroke="#f5be2c" stroke-width="2"/>
    <circle cx="68" cy="30" r="3" fill="#ffe89e"/>
    <!-- Feed Support Struts -->
    <line x1="26" y1="42" x2="68" y2="30" stroke="#f5be2c" stroke-width="1.2" opacity="0.8"/>
    <line x1="56" y1="68" x2="68" y2="30" stroke="#f5be2c" stroke-width="1.2" opacity="0.8"/>
    <!-- Ground Pedestal Base -->
    <path d="M38 66 L28 86 L58 86 L48 66 Z" fill="#2a3440" stroke="#f5be2c" stroke-width="2"/>
    <line x1="20" y1="86" x2="66" y2="86" stroke="#f5be2c" stroke-width="2.5" stroke-linecap="round"/>
  
  </g>
</svg>