<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Globe Theatre Polygonal Wooden Playhouse & Drama Masks -->
    <!-- Theatre Walls -->
    <polygon points="24,46 36,36 64,36 76,46 76,74 24,74" fill="#3a2a1a" stroke="#f5be2c" stroke-width="2"/>
    <!-- Thatched Roof -->
    <polygon points="20,48 34,32 66,32 80,48" fill="#854d0e" stroke="#ffe89e" stroke-width="2"/>
    <!-- Courtyard Open Ring -->
    <ellipse cx="50" cy="52" rx="16" ry="8" fill="#12161a" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Flag atop tower -->
    <line x1="50" y1="16" x2="50" y2="32" stroke="#f5be2c" stroke-width="2"/>
    <polygon points="50,18 64,22 50,26" fill="#b91c1c"/>
    <!-- Comedy/Tragedy Masks in Foreground -->
    <ellipse cx="38" cy="74" rx="8" ry="10" fill="#ffe89e" stroke="#12161a" stroke-width="1.5"/>
    <circle cx="35" cy="72" r="1.5" fill="#12161a"/>
    <circle cx="41" cy="72" r="1.5" fill="#12161a"/>
    <path d="M35 78 Q38 82 41 78" stroke="#12161a" stroke-width="1.5" fill="none"/>
    <ellipse cx="62" cy="74" rx="8" ry="10" fill="#f5be2c" stroke="#12161a" stroke-width="1.5"/>
    <circle cx="59" cy="72" r="1.5" fill="#12161a"/>
    <circle cx="65" cy="72" r="1.5" fill="#12161a"/>
    <path d="M59 80 Q62 76 65 80" stroke="#12161a" stroke-width="1.5" fill="none"/>
  
  </g>
</svg>