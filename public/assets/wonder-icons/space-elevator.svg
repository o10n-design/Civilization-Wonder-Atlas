<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Planetary Tether to Geostationary Orbit -->
    <!-- Earth Arc at Bottom -->
    <path d="M12 84 C34 76 66 76 88 84" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <!-- Cable Tether to the Stars -->
    <line x1="50" y1="12" x2="50" y2="80" stroke="#f8fafc" stroke-width="2"/>
    <!-- Climber Pod Ascending -->
    <rect x="46" y="44" width="8" height="12" rx="2" fill="#f5be2c" stroke="#ffe89e" stroke-width="1.5"/>
    <line x1="42" y1="50" x2="58" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Orbital Counterweight Station -->
    <circle cx="50" cy="18" r="6" fill="#0284c7" stroke="#ffe89e" stroke-width="1.5"/>
    <line x1="38" y1="18" x2="62" y2="18" stroke="#38bdf8" stroke-width="1.5"/>
  
  </g>
</svg>