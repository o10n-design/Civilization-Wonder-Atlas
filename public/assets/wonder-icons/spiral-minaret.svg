<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Iconic Malwiya Minaret of Samarra -->
    <polygon points="48,16 52,16 51,22 49,22" fill="#ffe89e"/>
    <!-- Stepped Spiral Conical Ramp -->
    <path d="M48,22 C44,24 56,24 52,28 C42,32 58,34 50,40 C38,46 62,48 48,56 C34,64 66,66 46,74 C30,82 70,82 50,86" fill="none" stroke="#f5be2c" stroke-width="3" stroke-linecap="round"/>
    <polygon points="45,24 55,24 64,52 36,52" fill="#d97706" opacity="0.3"/>
    <polygon points="36,52 64,52 74,84 26,84" fill="#b45309" opacity="0.4"/>
    <!-- Base Platform -->
    <rect x="22" y="82" width="56" height="6" fill="#78350f" stroke="#f5be2c" stroke-width="2"/>
  
  </g>
</svg>