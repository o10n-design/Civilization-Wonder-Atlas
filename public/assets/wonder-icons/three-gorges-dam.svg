<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Monumental Three Gorges Dam with Spillway Cascades -->
    <!-- Mountain Gorges -->
    <polygon points="12,20 32,46 16,84" fill="#334155" stroke="#f5be2c" stroke-width="1.5"/>
    <polygon points="88,20 68,46 84,84" fill="#334155" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Huge Straight Spillway Barrier -->
    <rect x="26" y="44" width="48" height="38" fill="#94a3b8" stroke="#ffe89e" stroke-width="2"/>
    <!-- Spillway Sluice Chutes -->
    <rect x="32" y="52" width="4" height="28" fill="#38bdf8"/>
    <rect x="40" y="52" width="4" height="28" fill="#38bdf8"/>
    <rect x="48" y="52" width="4" height="28" fill="#38bdf8"/>
    <rect x="56" y="52" width="4" height="28" fill="#38bdf8"/>
    <rect x="64" y="52" width="4" height="28" fill="#38bdf8"/>
    <!-- Foaming Water Cascade -->
    <ellipse cx="50" cy="82" rx="30" ry="6" fill="#e0f2fe" opacity="0.8"/>
  
  </g>
</svg>