<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Art Deco Broadway Marquee & Neon Lights -->
    <polygon points="24,28 76,28 68,52 32,52" fill="#1e1b4b" stroke="#f5be2c" stroke-width="2"/>
    <rect x="30" y="32" width="40" height="16" fill="#f43f5e" stroke="#ffe89e" stroke-width="1"/>
    <!-- Broadway Lettering "B" -->
    <text x="50" y="44" fill="#ffe89e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">★ B ★</text>
    <!-- Entrance Arch -->
    <rect x="28" y="52" width="44" height="28" fill="#0f172a" stroke="#f5be2c" stroke-width="2"/>
    <path d="M38 80 C38 66 62 66 62 80 Z" fill="#f43f5e" opacity="0.4"/>
  
  </g>
</svg>