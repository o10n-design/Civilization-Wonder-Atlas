<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Crusader Heater Shield with Three Golden Lions and Broadsword -->
    <!-- Crossed Broadswords -->
    <line x1="22" y1="22" x2="78" y2="78" stroke="#ffe89e" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="22" x2="22" y2="78" stroke="#ffe89e" stroke-width="3" stroke-linecap="round"/>
    <!-- Sword Crossguards -->
    <line x1="28" y1="18" x2="18" y2="28" stroke="#f5be2c" stroke-width="4"/>
    <line x1="72" y1="18" x2="82" y2="28" stroke="#f5be2c" stroke-width="4"/>
    <!-- Heater Shield -->
    <path d="M30 26 L70 26 C70 54 50 78 50 78 C50 78 30 54 30 26 Z" fill="#b91c1c" stroke="#f5be2c" stroke-width="3"/>
    <!-- Shield Cross / Royal Charge -->
    <path d="M46 26 L54 26 L54 75 L46 75 Z" fill="#f5be2c"/>
    <path d="M30 42 L70 42 L70 50 L30 50 Z" fill="#f5be2c"/>
    <!-- Crown on top of shield -->
    <polygon points="36,22 42,14 50,18 58,14 64,22" fill="#ffe89e" stroke="#f5be2c" stroke-width="1.5"/>
  
  </g>
</svg>