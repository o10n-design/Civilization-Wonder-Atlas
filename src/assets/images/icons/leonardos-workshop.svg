<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Da Vinci Aerial Screw / Helicopter & Mechanical Gears -->
    <!-- Concentric Technical Circle -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="#f5be2c" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
    <!-- Interlocking Gear -->
    <path d="M38 64 L42 61 L40 57 L44 55 L45 50 L49 50 L51 46 L55 48 L58 45 L60 49 L64 48 L64 53 L68 54 L66 58 L70 61 L66 64 L68 68 L64 69 L64 74 L60 73 L58 77 L55 74 L51 76 L49 72 L45 72 L44 67 L40 65 Z" fill="#2a323c" stroke="#f5be2c" stroke-width="2"/>
    <circle cx="54" cy="61" r="5" fill="#12161a" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Aerial Screw Rotor Blade Helix -->
    <line x1="50" y1="16" x2="50" y2="48" stroke="#ffe89e" stroke-width="2.5"/>
    <ellipse cx="50" cy="20" rx="36" ry="6" fill="none" stroke="#ffe89e" stroke-width="2"/>
    <path d="M16 20 C24 32 76 32 84 20" fill="none" stroke="#ffe89e" stroke-width="2"/>
    <path d="M22 23 C30 36 70 36 78 23" fill="none" stroke="#f5be2c" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Supporting Tripod Struts -->
    <line x1="50" y1="48" x2="30" y2="82" stroke="#f5be2c" stroke-width="2"/>
    <line x1="50" y1="48" x2="70" y2="82" stroke="#f5be2c" stroke-width="2"/>
    <line x1="50" y1="48" x2="50" y2="82" stroke="#f5be2c" stroke-width="2"/>
  
  </g>
</svg>