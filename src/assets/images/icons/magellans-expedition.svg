<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Renaissance Galleon & Mariner Compass -->
    <!-- Ocean Waves -->
    <path d="M12 76 C24 73 36 78 48 75 C60 72 72 77 88 74" fill="none" stroke="#46d2bc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 84 C30 81 42 86 54 83 C66 80 78 85 86 82" fill="none" stroke="#46d2bc" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <!-- Ship Hull -->
    <path d="M22 62 C34 76 66 76 78 62 L74 54 L26 54 Z" fill="#9a6e1a" stroke="#f5be2c" stroke-width="2"/>
    <!-- Masts -->
    <line x1="38" y1="54" x2="38" y2="20" stroke="#f5be2c" stroke-width="2.5"/>
    <line x1="58" y1="54" x2="58" y2="15" stroke="#f5be2c" stroke-width="2.5"/>
    <line x1="72" y1="54" x2="72" y2="30" stroke="#f5be2c" stroke-width="1.8"/>
    <!-- Billowing Sails -->
    <path d="M38 24 C48 24 48 40 38 42 C46 40 46 26 38 24 Z" fill="#ffe89e" stroke="#f5be2c" stroke-width="1.5"/>
    <path d="M58 18 C70 18 70 38 58 40 C68 38 68 20 58 18 Z" fill="#ffe89e" stroke="#f5be2c" stroke-width="1.5"/>
    <path d="M58 41 C68 41 68 52 58 53 Z" fill="#ffe89e" stroke="#f5be2c" stroke-width="1.2"/>
    <!-- North Star -->
    <polygon points="80,16 82,21 87,22 83,26 84,31 80,28 76,31 77,26 73,22 78,21" fill="#ffe89e"/>
  
  </g>
</svg>