<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Tiered Classical Tomb with Ionic Columns & Quadriga -->
    <!-- Quadriga (Chariot) at the Top -->
    <polygon points="46,18 54,18 58,24 42,24" fill="#ffe89e"/>
    <!-- Stepped Pyramid Roof -->
    <polygon points="40,24 60,24 68,36 32,36" fill="#9a6e1a" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Columned Peristyle Level -->
    <rect x="28" y="36" width="44" height="20" fill="#1e293b" stroke="#f5be2c" stroke-width="2"/>
    <line x1="33" y1="36" x2="33" y2="56" stroke="#ffe89e" stroke-width="2"/>
    <line x1="41" y1="36" x2="41" y2="56" stroke="#ffe89e" stroke-width="2"/>
    <line x1="50" y1="36" x2="50" y2="56" stroke="#ffe89e" stroke-width="2"/>
    <line x1="59" y1="36" x2="59" y2="56" stroke="#ffe89e" stroke-width="2"/>
    <line x1="67" y1="36" x2="67" y2="56" stroke="#ffe89e" stroke-width="2"/>
    <!-- Massive Podium Base -->
    <polygon points="24,56 76,56 80,82 20,82" fill="#475569" stroke="#f5be2c" stroke-width="2"/>
    <rect x="42" y="66" width="16" height="16" fill="#0f172a" stroke="#f5be2c" stroke-width="1.5"/>
  
  </g>
</svg>