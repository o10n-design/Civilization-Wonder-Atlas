<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Cambridge Great Gate & Light Refracting Prism -->
    <!-- Tudor Gate Towers -->
    <polygon points="24,42 28,26 32,42" fill="#78350f" stroke="#f5be2c" stroke-width="1.5"/>
    <polygon points="68,42 72,26 76,42" fill="#78350f" stroke="#f5be2c" stroke-width="1.5"/>
    <rect x="24" y="42" width="10" height="38" fill="#78350f" stroke="#f5be2c" stroke-width="1.5"/>
    <rect x="66" y="42" width="10" height="38" fill="#78350f" stroke="#f5be2c" stroke-width="1.5"/>
    <rect x="34" y="48" width="32" height="32" fill="#451a03" stroke="#f5be2c" stroke-width="1.5"/>
    <path d="M42 80 C42 66 58 66 58 80 Z" fill="#0f172a" stroke="#ffe89e" stroke-width="1.5"/>
    <!-- Triangular Prism Refraction -->
    <polygon points="50,22 40,38 60,38" fill="#38bdf8" opacity="0.8" stroke="#ffe89e" stroke-width="1.5"/>
    <line x1="22" y1="30" x2="45" y2="30" stroke="#f8fafc" stroke-width="2"/>
    <!-- Dispersed Spectral Rays -->
    <line x1="55" y1="30" x2="78" y2="24" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="80" y2="28" stroke="#f5be2c" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="79" y2="33" stroke="#22c55e" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="77" y2="37" stroke="#3b82f6" stroke-width="1.2"/>
  
  </g>
</svg>