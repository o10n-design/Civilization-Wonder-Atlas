<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Temple of Apollo at Delphi & Sacred Laurel Tripod -->
    <polygon points="26,38 50,22 74,38" fill="#f8fafc" stroke="#f5be2c" stroke-width="2"/>
    <line x1="32" y1="38" x2="32" y2="72" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="50" y1="38" x2="50" y2="72" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="68" y1="38" x2="68" y2="72" stroke="#e2e8f0" stroke-width="2.5"/>
    <!-- Flaming Bronze Tripod -->
    <polygon points="46,54 54,54 50,68" fill="#b45309" stroke="#f5be2c" stroke-width="1.5"/>
    <line x1="44" y1="78" x2="48" y2="60" stroke="#f5be2c" stroke-width="1.5"/>
    <line x1="56" y1="78" x2="52" y2="60" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Sacred Flame -->
    <path d="M50 44 C47 50 53 52 50 54 C48 52 46 48 50 44 Z" fill="#ef4444"/>
    <circle cx="50" cy="48" r="2" fill="#f5be2c"/>
  
  </g>
</svg>