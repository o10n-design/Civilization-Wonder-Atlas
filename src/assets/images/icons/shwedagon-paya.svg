<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Golden Stupa of Yangon with Radiant Buddhist Aura -->
    <!-- Spire Needle -->
    <line x1="50" y1="12" x2="50" y2="30" stroke="#ffe89e" stroke-width="2.5"/>
    <polygon points="50,10 47,16 53,16" fill="#ffe89e"/>
    <!-- Stepped Rings -->
    <ellipse cx="50" cy="32" rx="6" ry="2" fill="#f5be2c"/>
    <ellipse cx="50" cy="38" rx="12" ry="3" fill="#f5be2c"/>
    <ellipse cx="50" cy="46" rx="18" ry="4" fill="#f5be2c"/>
    <!-- Giant Golden Bell Dome -->
    <path d="M30 64 C30 48 70 48 70 64 Z" fill="#f5be2c" stroke="#ffe89e" stroke-width="2"/>
    <!-- Plinth Octagonal Base -->
    <polygon points="22,78 78,78 84,86 16,86" fill="#b45309" stroke="#ffe89e" stroke-width="2"/>
  
  </g>
</svg>