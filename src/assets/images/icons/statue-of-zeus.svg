<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Enthroned Zeus with Lightning Bolt & Eagle -->
    <!-- Throne Backrest -->
    <rect x="32" y="22" width="36" height="58" fill="#78350f" stroke="#f5be2c" stroke-width="2"/>
    <!-- Zeus Crown / Head -->
    <circle cx="50" cy="30" r="7" fill="#ffe89e"/>
    <path d="M43 32 Q50 44 57 32" fill="#ffe89e"/>
    <!-- Robed Torso -->
    <path d="M40 38 L60 38 L64 74 L36 74 Z" fill="#f8fafc" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Scepter with Eagle -->
    <line x1="34" y1="18" x2="34" y2="76" stroke="#f5be2c" stroke-width="2"/>
    <polygon points="34,14 31,18 37,18" fill="#ffe89e"/>
    <!-- Lightning Bolt in Hand -->
    <polygon points="68,34 62,44 67,44 61,56 73,42 67,42" fill="#f5be2c" stroke="#ffe89e" stroke-width="1"/>
  
  </g>
</svg>