<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Ancient Chinese Pagoda Fortress & Crossed Dao Sabers -->
    <!-- Pagoda Eaves -->
    <path d="M22 36 C34 32 66 32 78 36 L70 26 C58 24 42 24 30 26 Z" fill="#b91c1c" stroke="#f5be2c" stroke-width="2"/>
    <path d="M28 26 C36 22 64 22 72 26 L66 18 C56 16 44 16 34 18 Z" fill="#9a6e1a" stroke="#ffe89e" stroke-width="2"/>
    <polygon points="50,12 47,18 53,18" fill="#ffe89e"/>
    <!-- Building Pillars -->
    <rect x="34" y="36" width="6" height="42" fill="#f5be2c"/>
    <rect x="60" y="36" width="6" height="42" fill="#f5be2c"/>
    <rect x="46" y="36" width="8" height="42" fill="#2a323c" stroke="#f5be2c" stroke-width="1"/>
    <!-- Platform Base -->
    <path d="M20 78 L80 78 L84 86 L16 86 Z" fill="#1c242c" stroke="#f5be2c" stroke-width="2"/>
    <!-- Crossed Dao Swords -->
    <path d="M24 72 C36 60 50 50 76 44" fill="none" stroke="#ffe89e" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 72 C64 60 50 50 24 44" fill="none" stroke="#ffe89e" stroke-width="3" stroke-linecap="round"/>
  
  </g>
</svg>