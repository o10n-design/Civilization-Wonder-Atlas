<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Timbuktu Earth-Adobe Mosque Minaret with Toron Beams -->
    <!-- Tapering Earth Minaret Tower -->
    <polygon points="44,22 56,22 64,84 36,84" fill="#b45309" stroke="#f5be2c" stroke-width="2"/>
    <!-- Protruding Timber Toron Scaffolding Beams -->
    <line x1="38" y1="36" x2="62" y2="36" stroke="#451a03" stroke-width="2"/>
    <line x1="34" y1="48" x2="66" y2="48" stroke="#451a03" stroke-width="2"/>
    <line x1="32" y1="60" x2="68" y2="60" stroke="#451a03" stroke-width="2"/>
    <line x1="30" y1="72" x2="70" y2="72" stroke="#451a03" stroke-width="2"/>
    <!-- Crescent Finial -->
    <path d="M50 16 C54 16 56 12 56 10 C52 11 50 14 50 16 Z" fill="#ffe89e"/>
  
  </g>
</svg>