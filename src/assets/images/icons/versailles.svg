<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f5be2c" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f5be2c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Sun King Golden Emblem & Grand Palace Wings -->
    <!-- Palace Classical Facade -->
    <rect x="18" y="48" width="64" height="26" fill="#cbd5e1" stroke="#f5be2c" stroke-width="2"/>
    <polygon points="40,48 50,38 60,48" fill="#e2e8f0" stroke="#f5be2c" stroke-width="1.5"/>
    <!-- Gilded Gate & Windows -->
    <rect x="44" y="58" width="12" height="16" fill="#f5be2c" stroke="#ffe89e" stroke-width="1.5"/>
    <!-- Sun King Radiant Crest -->
    <circle cx="50" cy="24" r="7" fill="#f5be2c" stroke="#ffe89e" stroke-width="1.5"/>
    <path d="M50 10 L50 14 M50 34 L50 38 M36 24 L40 24 M60 24 L64 24 M40 14 L43 17 M57 31 L60 34 M60 14 L57 17 M40 34 L43 31" stroke="#ffe89e" stroke-width="2" stroke-linecap="round"/>
  
  </g>
</svg>