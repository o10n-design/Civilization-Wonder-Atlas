<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f262e" />
      <stop offset="70%" stop-color="#101418" />
      <stop offset="100%" stop-color="#0a0d10" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#9a6e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#f8fafc" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Wonder Art -->
  <g transform="translate(14, 14)">
    
    <!-- Glistening Gypsum Sand Dunes of New Mexico -->
    <path d="M14 68 C30 54 48 76 66 60 C78 50 86 64 88 74 L88 86 L14 86 Z" fill="#f8fafc" stroke="#f5be2c" stroke-width="2"/>
    <path d="M14 76 C28 66 44 82 58 72 C72 62 82 78 88 82" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Desert Sun -->
    <circle cx="68" cy="30" r="12" fill="#f5be2c" opacity="0.8"/>
  
  </g>
</svg>